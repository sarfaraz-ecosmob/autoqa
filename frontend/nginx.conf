server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 "ok";
    }

    # Vite emits content-hashed filenames — safe to cache immutably.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html references the hashed bundles, so it must never be cached:
    # every load revalidates and picks up new deploys immediately. This
    # prevents "stale bundle" bugs after every frontend release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: route everything to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
