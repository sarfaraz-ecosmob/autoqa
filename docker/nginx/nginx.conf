upstream frontend {
    server frontend:80;
}

upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # ---- API ----
    # Sync endpoints that call slow external services (the AI assistant's
    # OpenRouter round-trip) can legitimately take ~30-40s. nginx's default
    # proxy_read_timeout is 60s but sentry-style hangs returned 504 to the
    # UI — raise the window and keep the backend's own budgets authoritative
    # (the assistant caps its LLM spend at ~30s and falls back to heuristic
    # answers, so this proxy timeout is a safety net, not the mechanism).
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---- Docs ----
    location /docs {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # ---- WebSocket (Phase 7) ----
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ---- Frontend SPA ----
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }
}
