services:
  # ---------- Edge ----------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, backend-net]

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [edge]

  # ---------- Backend API ----------
  backend:
    build: ./backend
    environment:
      AUTOQA_ENVIRONMENT: ${AUTOQA_ENVIRONMENT:-development}
      AUTOQA_SECRET_KEY: ${AUTOQA_SECRET_KEY:-dev_only_change_me}
      AUTOQA_REDIS_URL: ${AUTOQA_REDIS_URL:-redis://redis:6379/0}
      AUTOQA_DATABASE_URL: ${AUTOQA_DATABASE_URL:-postgresql+psycopg://autoqa:autoqa_dev_password@postgres:5432/autoqa}
      AUTOQA_MINIO_ENDPOINT: ${AUTOQA_MINIO_ENDPOINT:-minio:9000}
      AUTOQA_MINIO_ACCESS_KEY: ${AUTOQA_MINIO_ACCESS_KEY:-autoqa}
      AUTOQA_MINIO_SECRET_KEY: ${AUTOQA_MINIO_SECRET_KEY:-autoqa_dev_password}
      AUTOQA_MINIO_BUCKET: ${AUTOQA_MINIO_BUCKET:-autoqa-artifacts}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [backend-net, worker-net]

  # ---------- Data ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoqa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-autoqa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend-net]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend-net, worker-net]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autoqa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-autoqa_dev_password}
    ports:
      - "9001:9001" # console (dev only)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend-net]

  # ---------- Workers ----------
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=2 --hostname=worker@%h
    environment:
      AUTOQA_ENVIRONMENT: ${AUTOQA_ENVIRONMENT:-development}
      AUTOQA_SECRET_KEY: ${AUTOQA_SECRET_KEY:-dev_only_change_me}
      AUTOQA_REDIS_URL: ${AUTOQA_REDIS_URL:-redis://redis:6379/0}
      AUTOQA_DATABASE_URL: ${AUTOQA_DATABASE_URL:-postgresql+psycopg://autoqa:autoqa_dev_password@postgres:5432/autoqa}
      AUTOQA_MINIO_ENDPOINT: ${AUTOQA_MINIO_ENDPOINT:-minio:9000}
      AUTOQA_MINIO_ACCESS_KEY: ${AUTOQA_MINIO_ACCESS_KEY:-autoqa}
      AUTOQA_MINIO_SECRET_KEY: ${AUTOQA_MINIO_SECRET_KEY:-autoqa_dev_password}
      AUTOQA_MINIO_BUCKET: ${AUTOQA_MINIO_BUCKET:-autoqa-artifacts}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [worker-net, backend-net]

  browser-worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=2 --queues=browser --hostname=browser-worker@%h
    environment:
      AUTOQA_ENVIRONMENT: ${AUTOQA_ENVIRONMENT:-development}
      AUTOQA_SECRET_KEY: ${AUTOQA_SECRET_KEY:-dev_only_change_me}
      AUTOQA_REDIS_URL: ${AUTOQA_REDIS_URL:-redis://redis:6379/0}
      AUTOQA_DATABASE_URL: ${AUTOQA_DATABASE_URL:-postgresql+psycopg://autoqa:autoqa_dev_password@postgres:5432/autoqa}
      AUTOQA_MINIO_ENDPOINT: ${AUTOQA_MINIO_ENDPOINT:-minio:9000}
      AUTOQA_MINIO_ACCESS_KEY: ${AUTOQA_MINIO_ACCESS_KEY:-autoqa}
      AUTOQA_MINIO_SECRET_KEY: ${AUTOQA_MINIO_SECRET_KEY:-autoqa_dev_password}
      AUTOQA_MINIO_BUCKET: ${AUTOQA_MINIO_BUCKET:-autoqa-artifacts}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [worker-net, backend-net]

  scheduler:
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    environment:
      AUTOQA_SECRET_KEY: ${AUTOQA_SECRET_KEY:-dev_only_change_me}
      AUTOQA_REDIS_URL: ${AUTOQA_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend-net]

  # ---------- Demo target (Phase 2+) ----------
  demo-app:
    build: ./demo-app
    ports:
      - "${DEMO_APP_PORT:-9000}:9000"
    restart: unless-stopped
    networks: [worker-net]

volumes:
  pgdata:
  miniodata:

networks:
  edge:
  backend-net:
  # worker-net has NO default gateway to the internet unless explicitly
  # proxied — used later for SSRF egress control (Phase 1+).
  worker-net:
